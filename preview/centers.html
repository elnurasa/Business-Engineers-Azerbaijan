<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mərkəz variantları</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Inter:wght@400;600&display=swap">
<style>
  body{margin:0;background:#0B0626;color:#F2E8FF;font-family:Inter,system-ui,sans-serif;padding:24px}
  h1{font:800 22px 'Plus Jakarta Sans',sans-serif;margin:0 0 16px}
  .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
  .c{border:1px solid rgba(192,128,240,.35);border-radius:16px;overflow:hidden;background:#140B3A}
  canvas{display:block;width:100%;height:auto}
  .c div{padding:12px 14px}
  .c b{display:block;font:600 15px 'Plus Jakarta Sans',sans-serif;margin-bottom:4px}
  .c span{font-size:13px;color:#CDBDF0;line-height:1.5}
</style>
</head>
<body>
<h1>Mərkəz üçün variantlar</h1>
<div class="g" id="g"></div>
<script>
(function () {
  var D = [
    ['E. Zərrəciklərdən BEA', 'Ulduz zərrəcikləri "BEA" sözünə yığılır, sonra növbə ilə xidmət ikonlarına çevrilir və geri qayıdır.'],
    ['F. Azərbaycan xəritəsi', 'Ulduz tozundan stilizə edilmiş xəritə, Bakıda parlayan ulduz. Kontur təxminidir.'],
    ['G. Mühəndis çarxı', 'Fırlanan dişli çarx (mühəndislik) içində insan ikonu (insan kapitalı).'],
    ['H. Təşkilat bürcü', 'Ulduzlar təşkilat sxemi kimi birləşir, zirvədə BEA, xətlər boyunca siqnallar axır.'],
    ['İ. Faktlar', 'Növbə ilə: 10+ il təcrübə, 12 sektor, 5 xidmət istiqaməti.']
  ];
  var g = document.getElementById('g'), C = [];
  D.forEach(function (d) {
    var c = document.createElement('div'); c.className = 'c';
    var cv = document.createElement('canvas'); cv.width = 560; cv.height = 360; c.appendChild(cv);
    var t = document.createElement('div'); var b = document.createElement('b'); b.textContent = d[0]; var s = document.createElement('span'); s.textContent = d[1];
    t.appendChild(b); t.appendChild(s); c.appendChild(t); g.appendChild(c); C.push(cv.getContext('2d'));
  });
  var W = 560, H = 360, cx = 280, cy = 180, TAU = Math.PI * 2;
  var stars = []; for (var i = 0; i < 60; i++) stars.push([Math.random() * W, Math.random() * H, Math.random() + 0.3, Math.random() * 6]);
  var dust = []; for (i = 0; i < 300; i++) dust.push([i % 2, Math.random() * TAU, (Math.random() - 0.5) * 12, Math.random() * 1.1 + 0.4]);
  var R = [[150, 58], [255, 106]];
  function bg(x, t) {
    var gr = x.createRadialGradient(cx, cy, 0, cx, cy, 380); gr.addColorStop(0, '#2B1668'); gr.addColorStop(0.45, '#1A0D47'); gr.addColorStop(1, '#0B0626');
    x.fillStyle = gr; x.fillRect(0, 0, W, H); x.globalCompositeOperation = 'lighter';
    stars.forEach(function (s) { x.fillStyle = 'rgba(255,255,255,' + (0.2 + 0.3 * (0.5 + 0.5 * Math.sin(t + s[3]))).toFixed(2) + ')'; x.fillRect(s[0], s[1], s[2], s[2]); });
    dust.forEach(function (q) { var rg = R[q[0]], th = q[1] + t * (q[0] ? 0.03 : -0.04), x2 = cx + (rg[0] + q[2]) * Math.cos(th), y2 = cy + (rg[1] + q[2] * 0.5) * Math.sin(th), d = (Math.sin(th) + 1) / 2; x.fillStyle = 'rgba(238,218,255,' + (0.2 + 0.45 * d).toFixed(2) + ')'; x.beginPath(); x.arc(x2, y2, q[3] * (0.6 + 0.6 * d), 0, TAU); x.fill(); });
    x.globalCompositeOperation = 'source-over';
  }
  function halo(x, X, Y, r, a) { x.globalCompositeOperation = 'lighter'; var h = x.createRadialGradient(X, Y, 0, X, Y, r); h.addColorStop(0, 'rgba(176,96,224,' + a + ')'); h.addColorStop(1, 'rgba(176,96,224,0)'); x.fillStyle = h; x.beginPath(); x.arc(X, Y, r, 0, TAU); x.fill(); x.globalCompositeOperation = 'source-over'; }
  function star4(x, X, Y, r, a) { if (r <= 0) return; x.beginPath(); x.moveTo(X, Y - r); x.quadraticCurveTo(X + r * 0.12, Y - r * 0.12, X + r, Y); x.quadraticCurveTo(X + r * 0.12, Y + r * 0.12, X, Y + r); x.quadraticCurveTo(X - r * 0.12, Y + r * 0.12, X - r, Y); x.quadraticCurveTo(X - r * 0.12, Y - r * 0.12, X, Y - r); x.fillStyle = 'rgba(255,250,255,' + a + ')'; x.fill(); }
  function dot(x, X, Y, r, a) { x.fillStyle = 'rgba(240,222,255,' + Math.max(0, a).toFixed(2) + ')'; x.beginPath(); x.arc(X, Y, r, 0, TAU); x.fill(); }

  /* E: particles morph between BEA and service icons */
  function sample(draw) {
    var o = document.createElement('canvas'); o.width = 200; o.height = 110; var c = o.getContext('2d');
    c.fillStyle = '#fff'; c.strokeStyle = '#fff'; draw(c);
    var d = c.getImageData(0, 0, 200, 110).data, P = [];
    for (var y = 0; y < 110; y += 3) for (var x = 0; x < 200; x += 3) if (d[(y * 200 + x) * 4 + 3] > 128) P.push([x - 100, y - 55]);
    return P.length ? P : [[0, 0]];
  }
  var shapes = [
    sample(function (c) { c.font = "900 76px 'Arial Black', Arial, sans-serif"; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('BEA', 100, 58); }),
    sample(function (c) { c.lineWidth = 7; c.beginPath(); c.arc(80, 38, 16, 0, TAU); c.stroke(); c.beginPath(); c.arc(80, 100, 34, Math.PI, TAU); c.stroke(); c.beginPath(); c.arc(126, 42, 12, 0, TAU); c.stroke(); c.beginPath(); c.arc(126, 96, 26, Math.PI * 1.1, TAU); c.stroke(); }),
    sample(function (c) { c.fillRect(56, 58, 22, 44); c.fillRect(90, 20, 22, 82); c.fillRect(124, 44, 22, 58); }),
    sample(function (c) { c.lineWidth = 7; c.beginPath(); c.arc(100, 56, 36, 0.4, Math.PI * 1.9); c.stroke(); c.beginPath(); c.moveTo(136, 22); c.lineTo(138, 46); c.lineTo(114, 44); c.stroke(); })
  ];
  var N = 650, parts = []; for (i = 0; i < N; i++) parts.push({ x: (Math.random() - 0.5) * 300, y: (Math.random() - 0.5) * 200, ph: Math.random() * 6 });
  var seq = [0, 1, 0, 2, 0, 3];

  /* F: stylised Azerbaijan outline (approximate) */
  var AZ = [[44.8,41.2],[45.5,41.4],[46.4,41.9],[46.7,41.8],[47.3,41.6],[47.9,41.2],[48.6,41.8],[49.1,41.3],[49.5,40.6],[50.4,40.4],[49.6,40.2],[49.4,39.8],[49.0,39.1],[48.9,38.4],[48.0,38.6],[48.3,39.3],[47.8,39.6],[47.0,39.2],[46.5,38.9],[46.3,39.6],[45.6,39.9],[45.9,40.5],[45.4,41.0],[44.8,41.2]];
  var NX = [[44.8,39.7],[45.6,39.4],[46.1,38.9],[45.4,38.95],[44.8,39.4],[44.8,39.7]];
  function azPts(poly) { var P = []; for (var i = 0; i < poly.length - 1; i++) { var a = poly[i], b = poly[i + 1], n = Math.max(3, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) * 14)); for (var k = 0; k < n; k++) { var f = k / n; P.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, Math.random() * 6]); } } return P; }
  var azA = azPts(AZ).concat(azPts(NX));
  function azXY(p) { return [cx + (p[0] - 47.6) * 46, cy - (p[1] - 40.15) * 58]; }

  /* H: org-chart constellation */
  var org = [[0,-70],[-90,-10],[0,-10],[90,-10],[-130,55],[-55,55],[25,55],[60,55],[130,55]], edges = [[0,1],[0,2],[0,3],[1,4],[1,5],[2,6],[3,7],[3,8]];

  var V = [
    function (x, t) {
      var cyc = Math.max(0, t) / 2.6, k = Math.floor(cyc) % seq.length, ph = cyc % 1, A = shapes[seq[k]], B = shapes[seq[(k + 1) % seq.length]];
      var f = ph < 0.55 ? 0 : (ph - 0.55) / 0.45, e = f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
      halo(x, cx, cy, 110, 0.3); x.globalCompositeOperation = 'lighter';
      parts.forEach(function (p, i) { var a = A[Math.floor(i * A.length / N)], b = B[Math.floor(i * B.length / N)], tx = a[0] + (b[0] - a[0]) * e, ty = a[1] + (b[1] - a[1]) * e; p.x += (tx - p.x) * 0.12; p.y += (ty - p.y) * 0.12; dot(x, cx + p.x * 1.25, cy + p.y * 1.25, 1.3, 0.55 + 0.4 * Math.sin(t * 3 + p.ph)); });
      x.globalCompositeOperation = 'source-over';
    },
    function (x, t) {
      halo(x, cx + 40, cy, 120, 0.25); x.globalCompositeOperation = 'lighter';
      azA.forEach(function (p) { var q = azXY(p); dot(x, q[0], q[1], 1.4, 0.45 + 0.45 * Math.sin(t * 2 + p[2])); });
      x.globalCompositeOperation = 'source-over';
      var b = azXY([49.87, 40.41]); halo(x, b[0], b[1], 30, 0.6); star4(x, b[0], b[1], 10 + 2 * Math.sin(t * 3), 0.95);
      x.font = '600 12px Inter, sans-serif'; x.fillStyle = '#E9D8FF'; x.fillText('Bakı', b[0] + 10, b[1] + 22);
    },
    function (x, t) {
      halo(x, cx, cy, 100, 0.35); x.save(); x.translate(cx, cy); x.rotate(t * 0.3);
      var n = 12, r1 = 46, r2 = 58; x.beginPath();
      for (var i = 0; i < n * 2; i++) { var a = i * Math.PI / n, r = i % 2 ? r1 : r2, a1 = a - Math.PI / n * 0.35, a2 = a + Math.PI / n * 0.35; x.lineTo(Math.cos(a1) * r, Math.sin(a1) * r); x.lineTo(Math.cos(a2) * r, Math.sin(a2) * r); }
      x.closePath(); var lg = x.createLinearGradient(-60, -60, 60, 60); lg.addColorStop(0, '#E8D2FF'); lg.addColorStop(0.5, '#9050D0'); lg.addColorStop(1, '#C43FBE');
      x.strokeStyle = lg; x.lineWidth = 3; x.stroke(); x.beginPath(); x.arc(0, 0, 32, 0, TAU); x.stroke(); x.restore();
      x.strokeStyle = '#fff'; x.lineWidth = 3; x.lineCap = 'round'; x.beginPath(); x.arc(cx, cy - 9, 8, 0, TAU); x.stroke(); x.beginPath(); x.arc(cx, cy + 18, 15, Math.PI * 1.1, Math.PI * 1.9); x.stroke();
    },
    function (x, t) {
      halo(x, cx, cy - 20, 120, 0.25); x.lineWidth = 1.2;
      edges.forEach(function (e, i) { var a = org[e[0]], b = org[e[1]]; x.strokeStyle = 'rgba(210,175,255,.45)'; x.beginPath(); x.moveTo(cx + a[0], cy + a[1]); x.lineTo(cx + b[0], cy + b[1]); x.stroke(); var u = (t * 0.6 + i * 0.17) % 1; x.globalCompositeOperation = 'lighter'; dot(x, cx + a[0] + (b[0] - a[0]) * u, cy + a[1] + (b[1] - a[1]) * u, 2.4, Math.sin(u * Math.PI)); x.globalCompositeOperation = 'source-over'; });
      org.forEach(function (p, i) {
        halo(x, cx + p[0], cy + p[1], i ? 16 : 30, 0.5);
        if (i) { star4(x, cx + p[0], cy + p[1], 6, 0.9); return; }
        var s = x.createRadialGradient(cx - 6, cy - 76, 2, cx, cy - 70, 20); s.addColorStop(0, '#F6EBFF'); s.addColorStop(0.35, '#C080F0'); s.addColorStop(1, '#4A2494');
        x.fillStyle = s; x.beginPath(); x.arc(cx, cy - 70, 20, 0, TAU); x.fill();
        x.font = "800 12px 'Plus Jakarta Sans', Arial, sans-serif"; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff'; x.fillText('BEA', cx, cy - 69); x.textAlign = 'left'; x.textBaseline = 'alphabetic';
      });
    },
    function (x, t) {
      var F = [['10+', 'il təcrübə'], ['12', 'sektor'], ['5', 'xidmət istiqaməti']], k = Math.floor(Math.max(0, t) / 3) % 3, f = (Math.max(0, t) % 3) / 3, a = f < 0.15 ? f / 0.15 : f > 0.85 ? (1 - f) / 0.15 : 1;
      halo(x, cx, cy, 110, 0.4);
      var s = x.createRadialGradient(cx - 14, cy - 16, 4, cx, cy, 52); s.addColorStop(0, 'rgba(246,235,255,.95)'); s.addColorStop(0.3, '#B57BEF'); s.addColorStop(0.75, '#6A36BE'); s.addColorStop(1, '#35187A');
      x.fillStyle = s; x.beginPath(); x.arc(cx, cy, 52, 0, TAU); x.fill();
      x.globalAlpha = a; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff'; x.font = "800 34px 'Plus Jakarta Sans', Arial, sans-serif"; x.fillText(F[k][0], cx, cy - 8);
      x.font = '600 10px Inter, sans-serif'; x.fillStyle = '#F2E6FF'; x.fillText(F[k][1].toUpperCase(), cx, cy + 18); x.globalAlpha = 1; x.textAlign = 'left'; x.textBaseline = 'alphabetic';
      for (var i = 0; i < 3; i++) { x.fillStyle = i === k ? '#fff' : 'rgba(255,255,255,.35)'; x.beginPath(); x.arc(cx - 10 + i * 10, cy + 72, 2.6, 0, TAU); x.fill(); }
    }
  ];
  var L = performance.now(), T = 0;
  function frame(n) { T += Math.max(0, (n - L) / 1000); L = n; C.forEach(function (x, i) { try { bg(x, T); V[i](x, T); } catch (err) { console.error(err); } }); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
